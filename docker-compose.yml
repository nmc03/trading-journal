services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "${HTTP_PORT:-8080}:3001"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
